<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marble</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .carousel { display: flex; overflow-x: auto; gap: 1rem; padding: 1rem; }
    .product { min-width: 200px; border: 1px solid #ddd; padding: 0.5rem; text-align: center; border-radius:8px; background:#fff; }
    .product img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="kota.html">Kota Stone</a></li>
      <li><a href="granite.html">Granite</a></li>
      <li><a href="marble.html">Marble</a></li>
      <li><a href="tiles.html">Tiles</a></li>
      <li><a href="others.html">Others</a></li>
    </ul>
  </nav>
  <section class="section">
    <h2 class="section-title">Marble Collection</h2>
    <div class="carousel">
      <div class="product"><img src="https://i.ibb.co/VFq94hp/IMG-20260614-WA0077.jpg" alt="Marble 1"/><div class="product-content"><h3>Marble 1</h3><button onclick="addToCart('Marble 1')">Add To Cart</button></div></div>
      <div class="product"><img src="https://i.ibb.co/7t8TKG7W/IMG-20260614-WA0075.jpg" alt="Marble 2"/><div class="product-content"><h3>Marble 2</h3><button onclick="addToCart('Marble 2')">Add To Cart</button></div></div>
      <div class="product"><img src="https://i.ibb.co/21QzWWFV/IMG-20260614-WA0072.jpg" alt="Marble 3"/><div class="product-content"><h3>Marble 3</h3><button onclick="addToCart('Marble 3')">Add To Cart</button></div></div>
      <div class="product"><img src="https://i.ibb.co/RGG0wFyZ/IMG-20260614-WA0068.jpg" alt="Marble 4"/><div class="product-content"><h3>Marble 4</h3><button onclick="addToCart('Marble 4')">Add To Cart</button></div></div>
      <div class="product"><img src="https://i.ibb.co/PvwZgsyH/IMG-20260614-WA0076.jpg" alt="Marble 5"/><div class="product-content"><h3>Marble 5</h3><button onclick="addToCart('Marble 5')">Add To Cart</button></div></div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    function addToCart(product) { let cart = JSON.parse(localStorage.getItem('cart') || '[]'); cart.push(product); localStorage.setItem('cart', JSON.stringify(cart)); alert(product + ' added to cart'); }
  </script>
</body>
</html>

  <title>Others</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .carousel { display: flex; overflow-x: auto; gap: 1rem; padding: 1rem; }
    .product { min-width: 200px; border: 1px solid #ddd; padding: 0.5rem; text-align: center; border-radius:8px; background:#fff; }
    .product img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="kota.html">Kota Stone</a></li>

    </ul>

  <section class="section">
    <h2 class="section-title">Other Products</h2>
    <div class="carousel">
      <div class="product">
        <img src="https://i.ibb.co/XZVnr1pQ/IMG-20260614-WA0007.jpg" alt="Other Product 1" />
        <div class="product-content"><h3>Other Product 1</h3><button onclick="addToCart('Other Product 1')">Add To Cart</button></div>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    function addToCart(product) { let cart = JSON.parse(localStorage.getItem('cart') || '[]'); cart.push(product); localStorage.setItem('cart', JSON.stringify(cart)); alert(product + ' added to cart'); }
  </script>
</body>

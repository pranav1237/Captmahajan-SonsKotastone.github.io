<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Granite</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .carousel { display: flex; overflow-x: auto; gap: 1rem; padding: 1rem; }
    .product { min-width: 200px; border: 1px solid #ddd; padding: 0.5rem; text-align: center; border-radius:8px; background:#fff; }
    .product img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="kota.html">Kota Stone</a></li>
      <li><a href="granite.html">Granite</a></li>
      <li><a href="marble.html">Marble</a></li>
      <li><a href="tiles.html">Tiles</a></li>
      <li><a href="others.html">Others</a></li>
    </ul>
  </nav>
  <section class="section">
    <h2 class="section-title">Granite Collection</h2>
    <div class="carousel">
      <div class="product">
        <img src="https://i.ibb.co/GQBrG5fw/IMG-20260614-WA0062.jpg" alt="Granite 1" />
        <div class="product-content">
          <h3>Granite 1</h3>
          <button onclick="addToCart('Granite 1')">Add To Cart</button>
        </div>
      </div>
      <div class="product">
        <img src="https://i.ibb.co/gLvLqCW7/IMG-20260614-WA0049.jpg" alt="Granite 2" />
        <div class="product-content">
          <h3>Granite 2</h3>
          <button onclick="addToCart('Granite 2')">Add To Cart</button>
        </div>
      </div>
      <div class="product">
        <img src="https://i.ibb.co/9kgGcj4r/IMG-20260614-WA0031.jpg" alt="Granite 3" />
        <div class="product-content">
          <h3>Granite 3</h3>
          <button onclick="addToCart('Granite 3')">Add To Cart</button>
        </div>
      </div>
      <div class="product">
        <img src="https://i.ibb.co/35Pq4thf/IMG-20260614-WA0029.jpg" alt="Granite 4" />
        <div class="product-content">
          <h3>Granite 4</h3>
          <button onclick="addToCart('Granite 4')">Add To Cart</button>
        </div>
      </div>
      <div class="product">
        <img src="https://i.ibb.co/xtL1CLWm/IMG-20260614-WA0018.jpg" alt="Granite 5" />
        <div class="product-content">
          <h3>Granite 5</h3>
          <button onclick="addToCart('Granite 5')">Add To Cart</button>
        </div>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    function addToCart(product) {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push(product);
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(product + ' added to cart');
    }
  </script>
</body>
</html>
